
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestoStock - Gestion de Matériel BTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0f172a',
                        secondary: '#1e293b',
                        accent: '#f59e0b',
                        accentDark: '#d97706',
                        danger: '#ef4444',
                        dangerLight: '#fca5a5',
                        success: '#10b981',
                        successLight: '#6ee7b7',
                        info: '#3b82f6',
                        textMain: '#f8fafc',
                        textMuted: '#94a3b8',
                        cardBg: '#1e293b',
                        cardBorder: '#334155'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            scroll-behavior: smooth;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
        input[type="file"]::file-selector-button {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #475569;
        }
    </style>
